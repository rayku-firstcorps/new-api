<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta name="robots" content="index, follow" />

    <!-- Primary Meta Tags -->
    <title>New API - Unified AI API Gateway</title>
    <meta name="title" content="New API - Unified AI API Gateway" />
    <meta
      name="description"
      content="New API provides a unified gateway for OpenAI, Claude, Gemini, Azure, AWS Bedrock, and other AI providers."
    />
    <link rel="canonical" href="/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="New API" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="New API - Unified AI API Gateway" />
    <meta
      property="og:description"
      content="A unified gateway for OpenAI, Claude, Gemini, Azure, AWS Bedrock, and other AI providers."
    />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="New API - Unified AI API Gateway" />
    <meta
      name="twitter:description"
      content="A unified gateway for OpenAI, Claude, Gemini, Azure, AWS Bedrock, and other AI providers."
    />
    <meta name="twitter:image" content="/logo.png" />

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
